<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Daily Orbit — Tuesday 24 November 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; }
  body {
    font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
    background: #f6f1e5;
    color: #16181d;
  }
  .page {
    width: 1024px; height: 1024px;
    padding: 22px 38px 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* ---------- masthead ---------- */
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 52px; font-weight: 700; letter-spacing: 3px; line-height: 1.05;
  }
  .mastmeta {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 3px solid #16181d; border-bottom: 1px solid #16181d;
    padding: 5px 2px 6px; margin-top: 8px;
    font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  }
  /* ---------- date band ---------- */
  .dateband {
    margin-top: 11px; background: #16181d; color: #f6f1e5;
    text-align: center; font-size: 44px; font-weight: 800; letter-spacing: 3px;
    padding: 8px 0 10px;
  }
  /* ---------- lead ---------- */
  .lead { margin-top: 12px; }
  .kicker { font-size: 16px; font-weight: 800; letter-spacing: 2.5px; color: #b3271e; text-transform: uppercase; }
  .leadart { display: block; width: 100%; height: 138px; margin-top: 7px; }
  .lead h2 { font-size: 47px; font-weight: 800; line-height: 1.05; margin-top: 8px; letter-spacing: 0.2px; }
  .lead .caption { font-size: 23px; line-height: 1.3; color: #2c313a; margin-top: 5px; }
  /* ---------- grid ---------- */
  .rule { border-top: 3px solid #16181d; margin: 12px 0 11px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px 22px; }
  .cell { border-top: 3px solid #16181d; padding-top: 9px; }
  .span2 { grid-column: span 2; }
  .span3 { grid-column: span 3; }
  .cell .kick { font-size: 14.5px; font-weight: 800; letter-spacing: 2px; color: #b3271e; text-transform: uppercase; }
  .cell .row { display: flex; gap: 12px; margin-top: 6px; align-items: flex-start; }
  .cell .icon { flex: 0 0 70px; width: 70px; height: 70px; }
  .cell h3 { font-size: 24.5px; font-weight: 800; line-height: 1.14; }
  .cell .cap { font-size: 19.5px; line-height: 1.3; color: #2c313a; margin-top: 6px; }
  /* ---------- footer ---------- */
  .footer { margin-top: auto; border-top: 3px solid #16181d; padding-top: 9px; }
  .footer .alsotitle { font-size: 17px; font-weight: 800; letter-spacing: 2.5px; }
  .footer .item { font-size: 19.5px; line-height: 1.38; color: #1d2129; white-space: nowrap; }
  .footer .item b { color: #b3271e; font-weight: 800; }
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1>{{TITLE}}</h1>
    <div class="mastmeta"><span>{{TAGLINE}}</span><span>One day &middot; One page</span></div>
  </header>

  <div class="dateband">{{DATELINE}}</div>

  <section class="lead">
    <div class="kicker">{{LEAD_KICKER}}</div>
    <svg class="leadart" viewBox="0 0 948 168" preserveAspectRatio="none" aria-label="A tall tower in a city skyline, struck, with an explosion burst and smoke">
      <rect x="0" y="0" width="948" height="168" fill="#dfe7ee"/>
      <!-- distant skyline -->
      <g fill="#7d8ea0">
        <rect x="0" y="104" width="52" height="56"/>
        <rect x="58" y="88" width="40" height="72"/>
        <rect x="104" y="112" width="60" height="48"/>
        <rect x="640" y="96" width="46" height="64"/>
        <rect x="692" y="80" width="38" height="80"/>
        <rect x="736" y="106" width="58" height="54"/>
        <rect x="800" y="90" width="42" height="70"/>
        <rect x="848" y="110" width="56" height="50"/>
        <rect x="910" y="98" width="38" height="62"/>
      </g>
      <!-- nearer blocks -->
      <g fill="#4a5a6a">
        <rect x="170" y="118" width="70" height="42"/>
        <rect x="248" y="106" width="54" height="54"/>
        <rect x="566" y="112" width="66" height="48"/>
      </g>
      <!-- incoming streak -->
      <polygon points="96,4 470,40 466,54 120,22" fill="#b3271e" opacity="0.9"/>
      <!-- the tallest tower -->
      <polygon points="428,160 466,14 500,14 538,160" fill="#232a33"/>
      <g fill="#f6f1e5" opacity="0.9">
        <rect x="472" y="30" width="7" height="9"/><rect x="488" y="30" width="7" height="9"/>
        <rect x="470" y="50" width="7" height="9"/><rect x="490" y="50" width="7" height="9"/>
        <rect x="468" y="70" width="7" height="9"/><rect x="492" y="70" width="7" height="9"/>
        <rect x="466" y="90" width="7" height="9"/><rect x="494" y="90" width="7" height="9"/>
        <rect x="464" y="110" width="7" height="9"/><rect x="496" y="110" width="7" height="9"/>
        <rect x="462" y="130" width="7" height="9"/><rect x="498" y="130" width="7" height="9"/>
      </g>
      <!-- explosion burst at the tower top -->
      <polygon fill="#e2571e" points="483,6 491,26 510,14 506,36 528,32 512,48 532,56 510,60 518,80 500,66 492,86 484,64 464,76 470,54 448,50 468,40 452,26 474,30 468,10"/>
      <polygon fill="#f2a03d" points="483,24 489,38 503,32 500,46 514,48 501,55 506,68 493,59 486,70 483,56 470,60 477,48 466,40 479,40 476,28"/>
      <!-- smoke -->
      <g fill="#8b959e">
        <circle cx="556" cy="30" r="13" opacity="0.85"/>
        <circle cx="588" cy="22" r="17" opacity="0.7"/>
        <circle cx="626" cy="16" r="21" opacity="0.55"/>
        <circle cx="668" cy="14" r="24" opacity="0.4"/>
      </g>
      <!-- ground -->
      <rect x="0" y="160" width="948" height="8" fill="#16181d"/>
    </svg>
    <h2>{{LEAD_HEADLINE}}</h2>
    <p class="caption">{{LEAD_CAPTION}}</p>
  </section>

  <div class="rule"></div>

  <main class="grid">
    {{STORY_CELLS}}
  </main>

  <footer class="footer">
    <div class="alsotitle">ALSO THAT DAY</div>
    {{ALSO_ITEMS}}
  </footer>

</div>
</body>
</html>
